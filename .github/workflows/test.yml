name: Test Debug

on:
  workflow_dispatch:

jobs:
  Test:
    name: Running Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.3

      - name: show go version
        run: go version

      - name: Test with the Go CLI
        run: go test -v ./...
